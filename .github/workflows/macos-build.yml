# ==============================================================================
# MedPharm ERP - macOS Build Pipeline
#
# Builds the MedPharm macOS desktop client on a macOS runner so that operators
# on Linux / Windows can produce a runnable .app without owning a Mac.
#
# Output: MedPharm.app — unsigned, will fail Gatekeeper on a colleague's Mac
#         until you sign + notarize. To gate-pass on first launch from a
#         downloaded zip, the recipient can run:
#             xattr -cr /Applications/MedPharm.app
#
# To produce a notarised build, add APPLE_API_KEY_ID / APPLE_API_ISSUER_ID /
# APPLE_API_KEY (App Store Connect API key) plus APPLE_DEVELOPER_ID
# (Developer ID Application: ...) secrets and adapt the `notarize` job.
#
# Triggers:
#   - push to master that touches macos/ or this workflow
#   - tag v*.*.* (release artifact)
#   - manual `gh workflow run macos-build.yml`
# ==============================================================================

name: Build macOS Client

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
    paths:
      - 'macos/**'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Debug or Release)'
        required: false
        default: 'Release'

defaults:
  run:
    working-directory: macos/MedPharm

jobs:
  build:
    name: Build MedPharm.app (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build MedPharm.app
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project MedPharm.xcodeproj \
            -scheme MedPharm \
            -configuration "$CONFIG" \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | (xcbeautify --renderer github-actions || cat)
          exit "${PIPESTATUS[0]}"

      - name: Locate produced .app bundle
        id: app
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products -type d -name 'MedPharm.app' | head -1)"
          if [[ -z "$APP" ]]; then echo "::error::No MedPharm.app produced"; exit 1; fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Built: $APP"

      - name: Zip MedPharm.app
        run: |
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" "${{ runner.temp }}/MedPharm-macOS.app.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: MedPharm-macOS
          path: ${{ runner.temp }}/MedPharm-macOS.app.zip
          if-no-files-found: error
          retention-days: 14
