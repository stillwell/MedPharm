; Manages the Cloud API, Web Portal, and Nginx processes.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/medpharm/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/medpharm/nginx-stdout.log
stderr_logfile=/var/log/medpharm/nginx-stderr.log

[program:medpharm-api]
command=/opt/medpharm/venv/bin/gunicorn run_cloud:app --bind 0.0.0.0:%(ENV_MEDPHARM_API_PORT)s --workers %(ENV_MEDPHARM_WORKERS)s --threads %(ENV_MEDPHARM_THREADS)s --timeout 120 --access-logfile /var/log/medpharm/api-access.log --error-logfile /var/log/medpharm/api-error.log --log-level info
directory=/opt/medpharm
user=medpharm
autostart=true
autorestart=true
priority=20
environment=PYTHONPATH="/opt/medpharm",MEDPHARM_DB_PATH="%(ENV_MEDPHARM_DB_PATH)s"
stdout_logfile=/var/log/medpharm/api-stdout.log
stderr_logfile=/var/log/medpharm/api-stderr.log

[program:medpharm-web]
command=/opt/medpharm/venv/bin/gunicorn run_web:app --bind 0.0.0.0:%(ENV_MEDPHARM_WEB_PORT)s --workers 2 --threads 2 --timeout 120 --access-logfile /var/log/medpharm/web-access.log --error-logfile /var/log/medpharm/web-error.log --log-level info
directory=/opt/medpharm
user=medpharm
autostart=true
autorestart=true
priority=30
environment=PYTHONPATH="/opt/medpharm",MEDPHARM_DB_PATH="%(ENV_MEDPHARM_DB_PATH)s"
stdout_logfile=/var/log/medpharm/web-stdout.log
stderr_logfile=/var/log/medpharm/web-stderr.log
