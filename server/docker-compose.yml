# ==============================================================================
# MedPharm ERP - Docker Compose (Ubuntu Server)
#
# Runs the full MedPharm ERP server stack:
#   - Nginx reverse proxy (port 80)
#   - Cloud REST API (Gunicorn)
#   - Patient Web Portal (Gunicorn)
#   - SQLite database (persistent volume)
#
# Usage:
#   cd server
#   docker compose up -d             # Start in background
#   docker compose logs -f           # View logs
#   docker compose down              # Stop
#   docker compose up -d --build     # Rebuild and start
#
# Test:
#   curl -k https://localhost/api/v1/health
#   curl -k https://localhost/portal/
# ==============================================================================

services:
  # Shared PostgreSQL database — the single backend every MedPharm client
  # (Qt desktop, web portal, REST API, and mobile clients via the API) reads
  # and writes, so they all see the same data. Unset MEDPHARM_DATABASE_URL on
  # the medpharm service to make it fall back to a private SQLite file instead.
  db:
    image: postgres:16-alpine
    container_name: medpharm-db
    environment:
      - POSTGRES_USER=medpharm
      - POSTGRES_PASSWORD=${MEDPHARM_DB_PASSWORD:-change-this-in-production}
      - POSTGRES_DB=medpharm
    volumes:
      - medpharm-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medpharm -d medpharm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  medpharm:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: medpharm-server
    hostname: medpharm
    ports:
      - "${MEDPHARM_HTTP_PORT:-80}:80"
      - "${MEDPHARM_HTTPS_PORT:-443}:443"
      - "${MEDPHARM_API_PORT:-8080}:8080"
      - "${MEDPHARM_WEB_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Shared PostgreSQL backend (default): every service pointed at this URL
      # reads/writes one database, so the API, web portal, and clients all see
      # the same data. Comment it out to fall back to the SQLite file below.
      - MEDPHARM_DATABASE_URL=postgresql+psycopg://medpharm:${MEDPHARM_DB_PASSWORD:-change-this-in-production}@db:5432/medpharm
      # - MEDPHARM_DB_PATH=/data/medpharm_erp.db
      - MEDPHARM_API_PORT=${MEDPHARM_API_PORT:-8080}
      - MEDPHARM_WEB_PORT=${MEDPHARM_WEB_PORT:-5000}
      - MEDPHARM_WORKERS=${MEDPHARM_WORKERS:-4}
      - MEDPHARM_THREADS=${MEDPHARM_THREADS:-2}
      - MEDPHARM_JWT_SECRET=${MEDPHARM_JWT_SECRET:-change-this-in-production}
      - MEDPHARM_SECRET_KEY=${MEDPHARM_SECRET_KEY:-change-this-in-production}
      - MEDPHARM_CORS_ORIGINS=${MEDPHARM_CORS_ORIGINS:-*}
      - MEDPHARM_TOKEN_EXPIRY=${MEDPHARM_TOKEN_EXPIRY:-86400}
      - MEDPHARM_REFRESH_EXPIRY=${MEDPHARM_REFRESH_EXPIRY:-604800}
      - MEDPHARM_TLS_MODE=${MEDPHARM_TLS_MODE:-auto}
      - MEDPHARM_TLS_HOSTNAME=${MEDPHARM_TLS_HOSTNAME:-localhost}
      - MEDPHARM_TLS_DAYS=${MEDPHARM_TLS_DAYS:-825}
    volumes:
      - medpharm-data:/data
      - medpharm-logs:/var/log/medpharm
      - medpharm-tls:/etc/ssl/medpharm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/medpharm/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  medpharm-pgdata:
    driver: local
  medpharm-data:
    driver: local
  medpharm-logs:
    driver: local
  medpharm-tls:
    driver: local
