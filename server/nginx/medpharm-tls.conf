# MedPharm ERP - Nginx TLS Reverse Proxy Configuration (HIPAA-grade)
# Copyright (C) 2026 Enlightec Ltd. (www.enlightec.com)
#
# Drop-in TLS variant of medpharm.conf. Enforces:
#   - TLS 1.2+ only (HIPAA § 164.312(e)(1) transmission security)
#   - HSTS preload, strict security headers
#   - /fhir/* and /api/* and /portal/* routed to the right upstream
#   - All plain-HTTP traffic 301-redirected to HTTPS
#
# Certificates:
#   Provision with ./server/nginx/generate-cert.sh (self-signed for dev)
#   or Let's Encrypt / ACM / your corporate CA for production.

upstream medpharm_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream medpharm_web {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── Redirect plain HTTP → HTTPS ─────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME/Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── TLS server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # ── TLS settings ────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/medpharm/fullchain.pem;
    ssl_certificate_key /etc/ssl/medpharm/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling (enable in production once CA chain is configured)
    # ssl_stapling        on;
    # ssl_stapling_verify on;
    # resolver            1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout    5s;

    # ── HIPAA-grade security headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Server "MedPharm ERP" always;

    # Request size limits (for file uploads — patient documents)
    client_max_body_size 25M;
    client_body_timeout  30s;

    # Rate limit login endpoints (mitigate credential stuffing)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── Cloud REST API — /api/* ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://medpharm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRF-Token";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    location = /api/v1/auth/login/patient {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://medpharm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/auth/login/staff {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://medpharm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── FHIR R4 read endpoints — /fhir/* ───────────────────────────────
    location /fhir/ {
        proxy_pass http://medpharm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ── Patient Web Portal — /portal/* ─────────────────────────────────
    location /portal/ {
        proxy_pass http://medpharm_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Script-Name /portal;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /portal/static/ {
        proxy_pass http://medpharm_web/static/;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # ── Root & health ───────────────────────────────────────────────────
    location = / {
        proxy_pass http://medpharm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        access_log off;
        proxy_pass http://medpharm_api/api/v1/health;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Structured access log that captures who hit PHI endpoints.
    # Pair with a SIEM forwarder (fluent-bit, vector, etc.).
    log_format  medpharm_json escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"remote":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"ua":"$http_user_agent",'
          '"ref":"$http_referer",'
          '"rt":$request_time'
        '}';
    access_log /var/log/nginx/medpharm-access.json medpharm_json;

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
