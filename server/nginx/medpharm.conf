# MedPharm ERP - Nginx Reverse Proxy Configuration
# Copyright (C) 2026 Enlightec Ltd. (www.enlightec.com)
#
# Routes:
#   /api/*    -> Cloud REST API (gunicorn :8080)
#   /portal/* -> Patient Web Portal (gunicorn :5000)
#   /         -> API root info page

upstream medpharm_api {
    server 127.0.0.1:8080;
}

upstream medpharm_web {
    server 127.0.0.1:5000;
}

server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Server "MedPharm ERP" always;

    # Request size limits (for file uploads)
    client_max_body_size 10M;

    # Cloud REST API - /api/* and root /
    location /api/ {
        proxy_pass http://medpharm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # Patient Web Portal - /portal/*
    location /portal/ {
        proxy_pass http://medpharm_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /portal;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Static files for web portal
    location /portal/static/ {
        proxy_pass http://medpharm_web/static/;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # Root - show API info
    location = / {
        proxy_pass http://medpharm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (no logging)
    location = /health {
        access_log off;
        proxy_pass http://medpharm_api/api/v1/health;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
