# ==============================================================================
# MedPharm ERP - Docker Compose (Pre-built API image from Docker Hub)
#
# Pulls the pre-built enlightec/medpharm-api image from Docker Hub instead of
# building from source. No local source code or Dockerfile required — the
# image runs the Cloud REST API on port 8080 with a persistent SQLite volume.
#
# Docker Hub: https://hub.docker.com/r/enlightec/medpharm-api
#
# Usage:
#   docker compose -f docker-compose.hub.yml pull    # Fetch latest image
#   docker compose -f docker-compose.hub.yml up -d   # Start in background
#   docker compose -f docker-compose.hub.yml logs -f # View logs
#   docker compose -f docker-compose.hub.yml down    # Stop
#
# Test:
#   curl http://localhost:8080/api/v1/health
#
# Override the image tag with:
#   MEDPHARM_IMAGE_TAG=1.5.1 docker compose -f docker-compose.hub.yml up -d
# ==============================================================================

services:
  api:
    image: enlightec/medpharm-api:${MEDPHARM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: medpharm-api
    ports:
      - "${MEDPHARM_PORT:-8080}:8080"
    environment:
      - MEDPHARM_JWT_SECRET=${MEDPHARM_JWT_SECRET:-change-this-in-production}
      - MEDPHARM_SECRET_KEY=${MEDPHARM_SECRET_KEY:-change-this-in-production}
      - MEDPHARM_DB_PATH=/data/medpharm_erp.db
      - MEDPHARM_CORS_ORIGINS=${MEDPHARM_CORS_ORIGINS:-*}
      - MEDPHARM_TOKEN_EXPIRY=${MEDPHARM_TOKEN_EXPIRY:-86400}
      - MEDPHARM_REFRESH_EXPIRY=${MEDPHARM_REFRESH_EXPIRY:-604800}
    volumes:
      - medpharm-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medpharm-data:
    driver: local
