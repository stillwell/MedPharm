# ==============================================================================
# MedPharm ERP - Docker Compose (Pre-built API image from Docker Hub)
#
# Pulls the pre-built enlightec/medpharm-api image from Docker Hub instead of
# building from source. No local source code or Dockerfile required — the
# image runs the Cloud REST API on port 8080 with a persistent SQLite volume.
#
# Docker Hub: https://hub.docker.com/r/enlightec/medpharm-api
#
# Usage:
#   docker compose -f docker-compose.hub.yml pull    # Fetch latest image
#   docker compose -f docker-compose.hub.yml up -d   # Start in background
#   docker compose -f docker-compose.hub.yml logs -f # View logs
#   docker compose -f docker-compose.hub.yml down    # Stop
#
# Test:
#   curl -k https://localhost:8080/api/v1/health
#
# Override the image tag with:
#   MEDPHARM_IMAGE_TAG=1.7.6 docker compose -f docker-compose.hub.yml up -d
#
# TLS:
#   Gunicorn serves HTTPS directly. A self-signed cert is generated on first
#   boot (dev default). For production, mount a CA-issued cert into the
#   medpharm-tls volume at {fullchain.pem,privkey.pem} and set
#   MEDPHARM_TLS_MODE=require. To disable TLS entirely, set MEDPHARM_TLS_MODE=disable.
# ==============================================================================

services:
  # Shared PostgreSQL database — the single backend every MedPharm client
  # (Qt desktop, web portal, REST API, and mobile clients via the API) reads
  # and writes, so they all see the same data. Requires an API image that
  # bundles the psycopg driver (shipped from 1.7.7 onward); for an older image
  # comment out MEDPHARM_DATABASE_URL on the api service to use SQLite instead.
  db:
    image: postgres:16-alpine
    container_name: medpharm-db
    environment:
      - POSTGRES_USER=medpharm
      - POSTGRES_PASSWORD=${MEDPHARM_DB_PASSWORD:-change-this-in-production}
      - POSTGRES_DB=medpharm
    volumes:
      - medpharm-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medpharm -d medpharm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: enlightec/medpharm-api:${MEDPHARM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: medpharm-api
    ports:
      - "${MEDPHARM_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MEDPHARM_JWT_SECRET=${MEDPHARM_JWT_SECRET:-change-this-in-production}
      - MEDPHARM_SECRET_KEY=${MEDPHARM_SECRET_KEY:-change-this-in-production}
      # Shared PostgreSQL backend (default): every service pointed at this URL
      # reads/writes one database, so the API and all clients see the same data.
      # Comment it out to fall back to the private SQLite file at MEDPHARM_DB_PATH.
      - MEDPHARM_DATABASE_URL=postgresql+psycopg://medpharm:${MEDPHARM_DB_PASSWORD:-change-this-in-production}@db:5432/medpharm
      # - MEDPHARM_DB_PATH=/data/medpharm_erp.db
      - MEDPHARM_CORS_ORIGINS=${MEDPHARM_CORS_ORIGINS:-*}
      - MEDPHARM_TOKEN_EXPIRY=${MEDPHARM_TOKEN_EXPIRY:-86400}
      - MEDPHARM_REFRESH_EXPIRY=${MEDPHARM_REFRESH_EXPIRY:-604800}
      - MEDPHARM_TLS_MODE=${MEDPHARM_TLS_MODE:-auto}
      - MEDPHARM_TLS_HOSTNAME=${MEDPHARM_TLS_HOSTNAME:-localhost}
      - MEDPHARM_TLS_DAYS=${MEDPHARM_TLS_DAYS:-825}
    volumes:
      - medpharm-data:/data
      - medpharm-tls:/etc/ssl/medpharm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:8080/api/v1/health || curl -sf http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional ngrok tunnel — exposes the api container to the public Internet
  # via ngrok's edge so that mobile/desktop clients sitting behind a firewall,
  # NAT or carrier-grade NAT can reach the API. The service is gated behind
  # the `ngrok` profile so it only starts when explicitly requested:
  #
  #   NGROK_AUTHTOKEN=2abc...  docker compose -f docker-compose.hub.yml \
  #       --profile ngrok up -d
  #
  # The container's local web inspector lives at http://127.0.0.1:4040; the
  # public URL appears in the "Web Interface" line of `docker compose logs
  # ngrok` and at http://127.0.0.1:4040/api/tunnels.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: medpharm-ngrok
    profiles: ["ngrok"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # NGROK_AUTHTOKEN is required at run time; the ngrok agent will refuse
      # to connect without it. Get a free token at https://dashboard.ngrok.com
      # and either export NGROK_AUTHTOKEN before `docker compose up` or place
      # it in a .env file alongside this compose file.
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
      - NGROK_REGION=${NGROK_REGION:-us}
    command:
      - "http"
      - "api:8080"
      - "--log=stdout"
      - "--log-format=logfmt"
    ports:
      # Expose the inspector / local API only on the loopback interface.
      - "127.0.0.1:4040:4040"

volumes:
  medpharm-pgdata:
    driver: local
  medpharm-data:
    driver: local
  medpharm-tls:
    driver: local
