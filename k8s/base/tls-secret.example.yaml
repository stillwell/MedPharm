#
# Template TLS secret consumed by deployment.yaml (volume: tls) and
# ingress.yaml (spec.tls.secretName). Create one of:
#
#   (a) Generate self-signed (dev/staging) via medpharm-k8s.sh install, OR
#   (b) Apply a cert-manager Certificate (recommended for production), OR
#   (c) kubectl create secret tls medpharm-tls \
#         --cert=fullchain.pem --key=privkey.pem -n medpharm
#
# This file is NOT referenced from kustomization.yaml — it is a template only.
# Never commit real certificates or keys.
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: medpharm-tls
  namespace: medpharm
  labels:
    app.kubernetes.io/name: medpharm
    app.kubernetes.io/component: server
data:
  tls.crt: BASE64_ENCODED_FULLCHAIN_PEM
  tls.key: BASE64_ENCODED_PRIVKEY_PEM
