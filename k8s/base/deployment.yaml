apiVersion: apps/v1
kind: Deployment
metadata:
  name: medpharm-server
  namespace: medpharm
  labels:
    app.kubernetes.io/name: medpharm
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "1.6.0"
spec:
  # SQLite-backed: must stay at 1 replica. To scale horizontally,
  # migrate MEDPHARM_DB_PATH to a networked database first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: medpharm
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medpharm
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "1.6.0"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: medpharm
          image: enlightec/medpharm-server:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: api
              containerPort: 8080
            - name: web
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: medpharm-config
            - secretRef:
                name: medpharm-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/medpharm
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medpharm-data
        - name: logs
          emptyDir: {}
