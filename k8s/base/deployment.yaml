apiVersion: apps/v1
kind: Deployment
metadata:
  name: medpharm-server
  namespace: medpharm
  labels:
    app.kubernetes.io/name: medpharm
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "1.7.6"
spec:
  # Backed by the shared PostgreSQL StatefulSet (medpharm-postgres:5432) via
  # MEDPHARM_DATABASE_URL, so the app is no longer single-writer-bound and may
  # be scaled horizontally by raising replicas. Left at 1 by default;
  # RollingUpdate is safe because every replica shares the one networked DB.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: medpharm
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medpharm
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "1.7.6"
    spec:
      # Pod-level security context. fsGroup=1000 matches the medpharm
      # system user inside the image (created by both Dockerfiles via
      # `useradd -r -s /usr/sbin/nologin -m -d /opt/medpharm`). seccomp
      # uses the kubelet's RuntimeDefault profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Hold the app back until PostgreSQL is accepting connections so it does
      # not crash-loop racing the database on a cold cluster start.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              until pg_isready -h medpharm-postgres -p 5432 -U medpharm; do
                echo "waiting for medpharm-postgres:5432 ..."; sleep 2;
              done
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: medpharm
          image: enlightec/medpharm-server:1.7.6
          imagePullPolicy: IfNotPresent
          # Container-level hardening. Mirrors the systemd unit's
          # NoNewPrivileges + drop-all-caps + non-root posture so the
          # security model is the same whether you ship via Docker, k8s,
          # or native systemd.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # Nginx in the medpharm-server image binds :80/:443. Without
              # NET_BIND_SERVICE a non-root process cannot listen on
              # privileged ports. If you front the deployment with an
              # external ingress and only need :8080/:5000, drop this too.
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: api
              containerPort: 8080
            - name: web
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: medpharm-config
            - secretRef:
                name: medpharm-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/medpharm
            - name: tls
              mountPath: /etc/ssl/medpharm
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medpharm-data
        - name: logs
          emptyDir: {}
        - name: tls
          secret:
            # The medpharm-k8s.sh installer creates this secret automatically
            # (self-signed by default). Replace with a CA-issued cert for prod.
            secretName: medpharm-tls
            optional: true
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
