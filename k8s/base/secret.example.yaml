# ------------------------------------------------------------------
# TEMPLATE — do NOT apply as-is to production.
#
# Generate real secrets with:
#   DBPASS="$(openssl rand -hex 32)"   # hex: URL-safe (no '/' or '+')
#   kubectl -n medpharm create secret generic medpharm-secrets \
#     --from-literal=MEDPHARM_JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=MEDPHARM_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=MEDPHARM_DB_PASSWORD="$DBPASS" \
#     --from-literal=MEDPHARM_DATABASE_URL="postgresql+psycopg://medpharm:${DBPASS}@medpharm-postgres:5432/medpharm"
#
# This file exists only so kustomize can validate the reference during
# `kubectl apply -k` when a pre-created secret does NOT yet exist in
# the cluster. Replace the placeholders before committing to a private
# repo, or delete this file once the secret is created out-of-band.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: medpharm-secrets
  namespace: medpharm
  labels:
    app.kubernetes.io/name: medpharm
    app.kubernetes.io/component: server
type: Opaque
stringData:
  MEDPHARM_JWT_SECRET: "CHANGE-ME-openssl-rand-base64-48"
  MEDPHARM_SECRET_KEY: "CHANGE-ME-openssl-rand-base64-48"
  # Password for the medpharm-postgres StatefulSet's superuser, and the full
  # connection URL the app reads (envFrom secretRef). The password is embedded
  # in the URL, so keep both in lock-step. The URL lives only in the Secret —
  # never in the ConfigMap — because it carries the credential.
  MEDPHARM_DB_PASSWORD: "CHANGE-ME-openssl-rand-hex-32"
  MEDPHARM_DATABASE_URL: "postgresql+psycopg://medpharm:CHANGE-ME-openssl-rand-hex-32@medpharm-postgres:5432/medpharm"
