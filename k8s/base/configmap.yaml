apiVersion: v1
kind: ConfigMap
metadata:
  name: medpharm-config
  namespace: medpharm
  labels:
    app.kubernetes.io/name: medpharm
    app.kubernetes.io/component: server
data:
  MEDPHARM_DB_PATH: "/data/medpharm_erp.db"
  MEDPHARM_HOST: "0.0.0.0"
  MEDPHARM_API_PORT: "8080"
  MEDPHARM_WEB_PORT: "5000"
  MEDPHARM_WORKERS: "4"
  MEDPHARM_THREADS: "2"
  MEDPHARM_TOKEN_EXPIRY: "86400"
  MEDPHARM_REFRESH_EXPIRY: "604800"
  MEDPHARM_CORS_ORIGINS: "*"
