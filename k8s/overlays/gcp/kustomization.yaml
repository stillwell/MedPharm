# GKE (Google Kubernetes Engine) overlay
#
# Requirements:
#   - A static global IP:   gcloud compute addresses create medpharm-ip --global
#   - A ManagedCertificate (see managedcertificate.yaml) linked in ingress-patch.
#   - A DNS A record for medpharm.example.com pointing to the reserved IP.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medpharm

resources:
  - ../../base
  - managedcertificate.yaml

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: medpharm-server
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: medpharm-data
